<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Shihao</title>
  <script>
    (function() {
      if (!sessionStorage.getItem('firstVisit')) {
        sessionStorage.setItem('firstVisit', 'true');
        window.location.href = '/landing';
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #root {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
    }

    #content {
      background: white;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      text-align: left;

    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 22px;
      color: #333;
      margin-top: 20px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const root = document.getElementById("root");
      if (!root) {
        console.error("No #root element found in HTML!");
        return;
      }

      // Apply inline styles to root for centering
      root.style.display = "flex";
      root.style.justifyContent = "center";
      root.style.alignItems = "center";
      root.style.height = "100vh";
      root.style.margin = "0";
      root.style.fontFamily = "Arial, sans-serif";
      root.style.backgroundColor = "white";

      // Create the centered content container
      root.innerHTML = `
        <div id="content" style="
          background: white;
          padding: 30px;
          max-width: 700px;
          width: 90%;
          text-align: left;
        ">
        <h1>Shihao</h1>

        <h2>I am...</h2>
        <ul>
            <li>excited about making the most of time we have together.</li>
            <li>a longboarder.</li>
            <li>a fan of bad dad jokes.
        </ul>

        <h2>My objectives is...</h2>
        
        <p>to equip myself with skills, tools, and empathy to maintain and advance our engines.</li>
        </p>

        <h2>I haven't forgotten...</h2>
        <ul>
            <li>the nights I climbed the roofs of Ithaca and felt like cave spelunkers.</li>
            <li>how my teachers, friends, and parents taught me to chase the stars in each others eyes.</li>
        </ul>
        <div style="
            display: flex;
            justify-content: center;
            align-items: center;
            height: 70px; /* Optional: Define a height if you want vertical centering */
        ">
        <a href="index.html" style="font-weight: bold; color: #105591;">more</a>
        </div>

        </div>
      `;
    });
  </script>

</body>
</html>
