<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I'm Shihao</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #root {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100%;
    }

    #content {
      background: white;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      text-align: left;

    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
    }

    h2 {
      font-size: 22px;
      color: #333;
      margin-top: 20px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 8px;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }

    .fade-in {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div id="root"></div>

   <script>
    document.addEventListener("DOMContentLoaded", () => {
      const root = document.getElementById("root");
      if (!root) {
        console.error("No #root element found in HTML!");
        return;
      }

      root.style.display = "flex";
      root.style.justifyContent = "center";
      root.style.alignItems = "center";
      root.style.height = "100vh";
      root.style.margin = "0";
      root.style.fontFamily = "Arial, sans-serif";
      root.style.backgroundColor = "white";

      // Inject HTML with sections
      root.innerHTML = `
        <div id="content">
          <div class="fade-section">
            <h1>Hello, I'm Shihao</h1>
          </div>

          <div class="fade-section">
            <h2>I am...</h2>
            <ul>
              <li>excited about making the most of time we have.</li>
              <li>a longboarder.</li>
              <li>a fan of bad jokes.</li>
            </ul>
          </div>

          <div class="fade-section">
            <h2>My objective is...</h2>
            <p>to equip myself with skills, tools, and empathy to maintain and advance our engines.</p>
          </div>

          <div class="fade-section">
            <h2>I haven't forgotten...</h2>
            <ul>
              <li>the nights we climbed the roofs of Ithaca and felt like cave spelunkers.</li>
              <li>how my teachers and friends taught me to chase the stars.</li>
            </ul>
          </div>

          <div class="fade-section" style="display: flex; justify-content: center; align-items: center; height: 40px;">
            <a href="index.html" style="font-weight: bold; color: #105591;">more</a>
          </div>
        </div>
      `;

      // Get all sections
      const sections = document.querySelectorAll(".fade-section");

      // Function to fade in sections sequentially
      function fadeInSections(sections, delay = 500) {
        sections.forEach((section, index) => {
          setTimeout(() => {
            section.classList.add("fade-in");
          }, index * delay);
        });
      }

      // Start the animation after a short delay
      setTimeout(() => fadeInSections(sections), 800);
    });
  </script>

</body>
</html>
